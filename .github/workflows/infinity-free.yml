name: 🚀 Deploy wp-content (orionimoi.wuaze.com)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'themes/**'
      - 'plugins/**'
      - 'mu-plugins/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /orionimoi.wuaze.com/htdocs/wp-content/
          local-dir: ./
          state-name: wpcontent-orion-root
          timeout: 600000
          exclude: |
            **/.git/**
            **/.git*
            **/.github/**
            **/.vscode/**
            **/node_modules/**
            **/vendor/**
            **/.env
            **/*.log
            **/debug.log
            uploads/**
            upgrade/**
            upgrade-temp-backup/**
