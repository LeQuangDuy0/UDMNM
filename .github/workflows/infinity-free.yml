name: 🚀 Deploy orionimoi.wuaze.com

on:
  push:
    branches: [ "main" ]
    paths:
      - 'themes/**'
      - 'plugins/**'
      - 'mu-plugins/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTP Deploy wp-content
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/wp-content/   # ĐÚNG: đẩy vào wp-content của site
          local-dir: ./                     # repo = wp-content
          state-name: wp-content-root
          timeout: 600000
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/vendor/**
            **/.env
            **/*.log
            **/debug.log
            uploads/**
            upgrade/**
            upgrade-temp-backup/**
